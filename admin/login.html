<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1a29">
  <title>Atlas Tracking — Admin Login</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">Secure operations</p>
    <h1>Atlas Tracking</h1>
    <p class="muted">Administrator sign in</p>
    <form id="login-form">
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary full-btn" type="submit">Sign in</button>
      <div id="login-message" class="notice hidden"></div>
    </form>
  </main>
  <script>
    const form=document.getElementById("login-form"),msg=document.getElementById("login-message");
    (async()=>{const {data}=await supabaseClient.auth.getSession();if(data.session) location.href="dashboard.html";})();
    form.addEventListener("submit",async e=>{
      e.preventDefault(); const b=form.querySelector("button"); b.disabled=true;b.textContent="Signing in…";
      const {error}=await supabaseClient.auth.signInWithPassword({email:form.email.value,password:form.password.value});
      if(error){msg.className="notice error";msg.textContent="Unable to sign in. Check your credentials.";msg.classList.remove("hidden");b.disabled=false;b.textContent="Sign in";return;}
      location.href="dashboard.html";
    });
  </script>
</body>
</html>
