<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get a quote — Atlas Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Atlas <span>Tracking</span></span>
    </a>
    <div class="navlinks">
      <a href="track.html">Track</a>
      <a href="services.html">Services</a>
      <a href="quote.html" class="active">Get a quote</a>
      <a href="contact.html">Contact</a>
      <a href="quote.html" class="btn btn-brass">Ship with us</a>
    </div>
    <button class="nav-toggle" data-nav-toggle aria-label="Menu">☰</button>
  </div>
</nav>

<section class="tight">
  <div class="wrap" style="max-width:640px;">
    <div class="eyebrow">Get a quote</div>
    <h1 style="font-size:2.2rem;">Tell us what you're shipping</h1>
    <p class="lede">We'll come back with a rate and estimated transit time by email.</p>

    <form id="quote-form" class="mt-32">
      <div class="field">
        <label for="q-name">Full name</label>
        <input id="q-name" name="name" type="text" required />
      </div>
      <div class="field">
        <label for="q-email">Email</label>
        <input id="q-email" name="email" type="email" required />
      </div>
      <div class="field">
        <label for="q-phone">Phone (optional)</label>
        <input id="q-phone" name="phone" type="tel" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="q-origin">Origin</label>
          <input id="q-origin" name="origin" type="text" placeholder="City, country" required />
        </div>
        <div class="field">
          <label for="q-destination">Destination</label>
          <input id="q-destination" name="destination" type="text" placeholder="City, country" required />
        </div>
      </div>
      <div class="field">
        <label for="q-details">Package details</label>
        <textarea id="q-details" name="package_details" placeholder="Weight, dimensions, contents, and preferred service" required></textarea>
      </div>
      <button class="btn btn-brass btn-block" type="submit">Request a quote</button>
    </form>
    <div id="quote-msg" class="mt-32"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 Atlas Tracking. All rights reserved.</span>
      <a href="admin/login.html">Admin login</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
</body>
</html>
